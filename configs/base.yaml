# Shared defaults for full-dictionary RackZero experiments. Other configs
# `extends:` this file and override only what they change. Every key is
# validated: misspelled keys are errors. Paths are relative to the working
# directory (run from the repository root). See docs/A100_TRAINING.md.
name: rackzero
seed: 42
iterations: 20
output_root: runs
dictionary: WOW24v3.zip      # user-supplied; not redistributed (see docs/RACKZERO.md)
max_turns: 200               # safety cutoff only; truncated games yield no targets
init_from: null              # new runs: start from this checkpoint's network (warm start)

runtime:
  device: auto               # auto | cpu | cuda
  threads: 1                 # torch threads in the trainer process
  precision: fp32            # fp32 | bf16 | fp16 (training autocast, CUDA only)
  tf32: true
  deterministic: false

model:
  arch: resnet               # resnet | cnn | legacy_mlp
  channels: 64
  blocks: 6
  latent: 256
  rack_dim: 64
  belief_dim: 64
  global_dim: 32
  move_dim: 128
  policy_hidden: 256
  value_hidden: 256
  policy_attention_layers: 0
  attention_heads: 4
  dropout: 0.0
  norm: batch                # batch | group | none
  value_head: scalar         # scalar (tanh win sign, MSE) | wdl (3-way cross-entropy)
  margin_head: true

search:
  method: ismcts             # stochastic | pimc | ismcts | belief | neural_determinization
  simulations: 32
  depth: 2
  candidates: 16             # shortlist size (+ pass + largest exchange)
  shortlist: score           # score (top scores) | mixed (half by score, half by score + leave)
  exploration: 1.5
  particles: 32
  # AlphaZero root exploration (self-play only; evaluation never uses it).
  # Before 2026-11-25 the default was off (0.0 / 0.0).
  root_noise_alpha: 0.3
  root_noise_fraction: 0.25
  movegen: fast              # fast (bit-identical, cached) | reference
  root_selection: puct       # puct (visit counts) | gumbel (Gumbel AlphaZero)
  gumbel_actions: 16         # gumbel: actions sampled at the root (sequential halving)
  gumbel_c_visit: 50.0
  gumbel_c_scale: 1.0
  gumbel_scale: 1.0          # gumbel noise in self-play (evaluation uses 0)

selfplay:
  games_per_iteration: 32
  workers: 4                 # parallel CPU processes (0 = in the trainer process)
  worker_threads: 1
  inference: local           # local (CPU per worker) | server (batched on trainer device)
  inference_batch_size: 32
  inference_max_wait_ms: 2.0
  inference_precision: fp32
  temperature: 1.0           # move sampling temperature over visit counts
  # Sample at temperature 1 for the first 8 plies, then play the most-visited
  # move (AlphaZero). Before 2026-11-25 the default was null (whole game at 1.0).
  temperature_moves: 8
  final_temperature: 0.0
  # Playout cap randomization (KataGo): a move is a full search with this
  # probability (policy target), else a fast search of fast_simulations
  # (value target only). 1.0 = off.
  full_search_probability: 1.0
  fast_simulations: null
  full_simulations: null     # self-play full-search budget (null = search.simulations)

replay:
  capacity: 100000

training:
  # Replay ratio: each iteration trains ceil(8 * new_positions / batch_size)
  # steps, so every generated position is sampled ~8 times over its lifetime
  # (the original default.yaml implied ~8). steps_per_iteration is then only
  # the LR-schedule horizon estimate. Set samples_per_position: null for a
  # fixed step count.
  samples_per_position: 8.0
  steps_per_iteration: 60
  batch_size: 128
  min_replay: 256
  optimizer: adam            # adam | adamw | sgd
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9
  lr_schedule: constant      # constant | cosine | step
  warmup_steps: 0
  lr_min_factor: 0.1
  lr_step_size: 1000
  lr_gamma: 0.5
  grad_clip: 5.0
  policy_loss_weight: 1.0
  value_loss_weight: 1.0
  margin_loss_weight: 1.0
  margin_scale: 100.0
  value_target_q_weight: 0.0 # value target = (1-w)*outcome + w*search value; 0 = outcome only

reanalyse:
  fraction: 0.0              # re-search fraction x new positions per iteration; 0 = off
  positions_per_task: 8

arena:
  mode: monitor              # gate (promote/roll back) | monitor (report only) | off
  games: 40
  threshold: 0.55
  criterion: threshold       # threshold | wilson
  every: 2

evaluation:
  every: 2
  games: 40
  opponents: [greedy, heuristic]
  seed: 1000                 # fixed: comparable across iterations and experiments

checkpoint:
  every: 1
  archive_replay: false

logging:
  tensorboard: false
  hardware_interval: 2.0
  progress: true
